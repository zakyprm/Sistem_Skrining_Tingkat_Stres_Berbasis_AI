<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login Ustadz/Konselor — Dashboard Skrining Stres Santri">
  <meta name="robots" content="noindex, nofollow">
  <title>Login Konselor — Skrining Stres Santri</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login.css">
</head>
<body class="login-body">

  <main class="login-wrapper" role="main">

    <!-- ─── Login Card ─── -->
    <div class="login-card" id="loginCard">

      <!-- Illustration / Icon -->
      <div class="login-icon-wrap">
        <div class="login-icon-ring">
          <svg class="login-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            <polyline points="9 12 11 14 15 10"></polyline>
          </svg>
        </div>
      </div>

      <!-- Header -->
      <div class="login-header">
        <p class="login-eyebrow">Akses Terbatas</p>
        <h1 class="login-title">
          Portal <span class="login-highlight">Konselor</span>
        </h1>
        <p class="login-subtitle">
          Masuk untuk mengakses dashboard riwayat skrining santri.
        </p>
      </div>

      <!-- Error Alert -->
      <div class="login-error" id="loginError" role="alert" aria-live="polite" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="loginErrorText">Username atau password salah.</span>
      </div>

      <!-- Form -->
      <form class="login-form" id="loginForm" novalidate>
        <div class="login-field">
          <label class="login-label" for="inputUsername">Username</label>
          <div class="login-input-wrap">
            <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input
              type="text"
              id="inputUsername"
              class="login-input"
              placeholder="Masukkan username"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              required
            >
          </div>
        </div>

        <div class="login-field">
          <label class="login-label" for="inputPassword">Password</label>
          <div class="login-input-wrap">
            <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input
              type="password"
              id="inputPassword"
              class="login-input"
              placeholder="Masukkan password"
              autocomplete="current-password"
              required
            >
            <button type="button" class="btn-toggle-pw" id="btnTogglePw"
                    aria-label="Tampilkan atau sembunyikan password">
              <svg id="iconEye" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg id="iconEyeOff" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="btnLogin">
          <span id="btnLoginText">Masuk ke Dashboard</span>
          <span id="btnLoginSpinner" class="login-spinner" style="display:none;" aria-hidden="true"></span>
        </button>
      </form>

      <!-- Footer note -->
      <p class="login-note">
        Akses khusus Ustadz/Konselor yang terdaftar.
        <br>Sesi aktif selama 8 jam atau hingga logout.
      </p>
    </div>

    <!-- Decorative background blobs -->
    <div class="login-blob login-blob-1" aria-hidden="true"></div>
    <div class="login-blob login-blob-2" aria-hidden="true"></div>
  </main>

  <script src="login.js"></script>
</body>
</html>
